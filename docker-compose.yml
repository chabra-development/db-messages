networks:
  db-messages-network:
    driver: bridge

services:
  postgres:
    image: postgres:17-alpine
    container_name: db-messages-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - type: bind
        source: D:\postgres-data
        target: /var/lib/postgresql/data
    networks:
      - db-messages-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  wsproxy:
    image: oven/bun:1.2-alpine
    container_name: db-messages-wsproxy
    restart: unless-stopped
    working_dir: /app
    command: ["bun", "run", "/app/wsproxy.ts"]
    volumes:
      - ./wsproxy.ts:/app/wsproxy.ts:ro
    environment:
      ALLOWED_HOST: postgres
      ALLOWED_PORT: 5432
      LISTEN_PORT: 8080
    networks:
      - db-messages-network
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  minio:
    image: minio/minio:latest
    container_name: db-messages-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chabra_admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - type: bind
        source: D:\minio-data
        target: /data
    networks:
      - db-messages-network
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: db-messages-app
    restart: unless-stopped
    environment:
      # Postgres interno (mesma docker network) — sem WS proxy
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      # Better Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      # OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # Storage MinIO interno
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: ${STORAGE_BUCKET:-chabra-db-messages}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      # Blip
      ROUTER_API_KEY: ${ROUTER_API_KEY}
      BLIP_DESK_API_KEY: ${BLIP_DESK_API_KEY}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - db-messages-network
    ports:
      - "127.0.0.1:3001:3000"

  # cloudflared NAO esta no compose: roda como servico Windows nativo na .107
  # gerenciando os hostnames db.chabra.com.br + storage.chabra.com.br + (futuro) wpp.chabra.com.br.
  # Ver wiki: db-messages/plano-self-host-107.md fase 3.
