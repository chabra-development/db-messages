<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chabra Tags</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #0f0f11;
      color: #e4e4e7;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid #27272a;
    }

    .header-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6366f1;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #fafafa;
    }

    /* ---- Estado: não autenticado ---- */
    #view-login {
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 11px;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #3f3f46;
      background: #18181b;
      color: #fafafa;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #6366f1; }

    .btn {
      padding: 9px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: #6366f1;
      color: #fff;
    }

    .btn-primary:not(:disabled):hover { opacity: 0.85; }

    .btn-ghost {
      background: transparent;
      color: #a1a1aa;
      border: 1px solid #3f3f46;
    }

    .btn-ghost:hover { background: #27272a; }

    .error-msg {
      font-size: 12px;
      color: #f87171;
      display: none;
    }

    /* ---- Estado: autenticado ---- */
    #view-authenticated {
      padding: 20px 16px;
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .user-name {
      font-weight: 600;
      color: #fafafa;
    }

    .user-email {
      font-size: 11px;
      color: #71717a;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 9999px;
      background: #14532d;
      color: #86efac;
      font-size: 11px;
      font-weight: 500;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
    }

    .divider {
      height: 1px;
      background: #27272a;
    }

    /* ---- Loading ---- */
    #view-loading {
      padding: 32px 16px;
      display: flex;
      justify-content: center;
      color: #52525b;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-dot"></div>
    <h1>Chabra Tags</h1>
  </div>

  <!-- Loading inicial -->
  <div id="view-loading">Carregando...</div>

  <!-- Formulário de login -->
  <div id="view-login" style="display: none;">
    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@chabra.com.br" autocomplete="email" />
    </div>
    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <p class="error-msg" id="login-error"></p>
    <button class="btn btn-primary" id="btn-login">Entrar</button>
  </div>

  <!-- Autenticado -->
  <div id="view-authenticated">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span class="status-badge">
        <span class="status-dot"></span>
        Conectado
      </span>
    </div>
    <div class="user-info">
      <span class="user-name" id="user-name">—</span>
      <span class="user-email" id="user-email">—</span>
    </div>
    <div class="divider"></div>
    <button class="btn btn-ghost" id="btn-logout">Sair</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
