name: Import Cron

on:
  schedule:
    - cron: "0 9 * * 1-5"   # 06h BRT (seg–sex)
    - cron: "0 1 * * 2-6"   # 22h BRT (seg–sex, dispara na madrugada do dia seguinte UTC)
  workflow_dispatch:
    inputs:
      step:
        description: "Etapa a executar (all | contacts | tickets | messages)"
        required: false
        default: "all"

jobs:
  import:
    name: Import BLiP → DB
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
      BLIP_DESK_API_KEY: ${{ secrets.BLIP_DESK_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: "1. Contatos"
        if: ${{ github.event.inputs.step == 'all' || github.event.inputs.step == 'contacts' || github.event_name == 'schedule' }}
        run: bun scripts/cron-import-contacts.ts

      - name: "2. Tickets"
        if: ${{ github.event.inputs.step == 'all' || github.event.inputs.step == 'tickets' || github.event_name == 'schedule' }}
        run: bun scripts/cron-import-tickets.ts

      - name: "3. Mensagens de Ticket"
        if: ${{ github.event.inputs.step == 'all' || github.event.inputs.step == 'messages' || github.event_name == 'schedule' }}
        run: bun scripts/run-import-ticket-messages.ts
